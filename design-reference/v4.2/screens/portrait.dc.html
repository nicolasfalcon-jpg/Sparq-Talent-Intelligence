<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<span role="img" aria-label="{{ label }}" style="display:inline-flex;width:{{ px }};height:{{ px }};border-radius:50%;overflow:hidden;flex:none;vertical-align:middle">
<svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true">
<rect width="100" height="100" fill="{{ bg }}"/>
<circle cx="78" cy="22" r="26" fill="#fff" opacity=".35"/>
<path d="{{ back }}" fill="{{ hair }}"/>
<path d="M12 106 C14 81 30 70 50 70 C70 70 86 81 88 106 Z" fill="{{ shirt }}"/>
<path d="M43 52 H57 V68 C57 72 43 72 43 68 Z" fill="{{ skin }}"/>
<path d="M43 58 H57 V62 C53 64 47 64 43 62 Z" fill="#000" opacity=".08"/>
<path d="M42 70 L50 80 L58 70 C55 69 45 69 42 70 Z" fill="{{ skin }}"/>
<ellipse cx="50" cy="41" rx="15" ry="18" fill="{{ skin }}"/>
<path d="{{ front }}" fill="{{ hair }}"/>
<path d="{{ beard }}" fill="{{ hair }}" opacity=".85"/>
</svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["ana","lucia","javier","ethan","sofia","camila","daniel","mateo","valentina","marcus","priya","tomas","laura"],"default":"ana"},"size":{"editor":"int","default":64,"min":16,"max":240},"$preview":{"width":120,"height":120}}'>

    const H = { dark:'#2E2320', brown:'#5B3B29', black:'#1C1918', auburn:'#8B4028', grey:'#A29C96', blonde:'#C8A266' };
    const P = {
      ana:      { n:'Ana Ruiz', skin:S.b, hair:H.brown, back:'long', front:'fringe', shirt:'#2F3A4A', bg:'#FFE4D6' },
      lucia:    { n:'Lucía Fernández', skin:S.c, hair:H.dark, back:'curly', front:'fringe', shirt:'#4A4E57', bg:'#EEE9F6' },

    const p = P[this.props.who] || P.ana;
    const size = Number(this.props.size ?? 64) || 64;
    return { px: size + 'px', label: 'Illustrated portrait of ' + p.n, bg: p.bg, skin: p.skin, hair: p.hair, shirt: p.shirt, back: B[p.back], front: F[p.front], beard: p.beard ? beard : '' };

</body>
